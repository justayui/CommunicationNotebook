spring.application.name=backend

# ローカル開発時はリポジトリ直下の.envから値を読み込む(backend/から起動する場合とリポジトリ直下から起動する場合の両方に対応)
# 本番環境では.envを置かず、環境変数で値を渡す
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:communication_notebook}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.servlet.session.timeout=30m

app.admin.employee-id=${ADMIN_EMPLOYEE_ID:E001}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.password=${ADMIN_PASSWORD}

logging.level.com.communicationnotebook=INFO
