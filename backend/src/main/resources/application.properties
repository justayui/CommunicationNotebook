spring.application.name=backend

# ローカル開発時はリポジトリ直下の.envから値を読み込む(backend/から起動する場合とリポジトリ直下から起動する場合の両方に対応)
# 本番環境では.envを置かず、環境変数で値を渡す
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:communication_notebook}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.servlet.session.timeout=30m
# CSRFトークンを使用しないため、他サイトからの変更リクエスト(POST・PUT・DELETEなど)にCookieを送らないようにする
server.servlet.session.cookie.same-site=lax

# nginx(リバースプロキシ)が付与するX-Forwarded-Protoを解釈し、CloudFront経由のHTTPS通信をHTTPSとして扱う
# (Swaggerの送信先URLがhttpsになり、セッションCookieにSecure属性が付く)
# Tomcatは内部ネットワークのプロキシからのヘッダーのみを信頼する
server.forward-headers-strategy=native

app.admin.employee-id=${ADMIN_EMPLOYEE_ID:E001}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.password=${ADMIN_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.com.communicationnotebook=INFO
