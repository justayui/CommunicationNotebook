# CloudFront経由の場合、元の通信がHTTPSかどうかは CloudFront-Forwarded-Proto ヘッダーで届く
# (CloudFrontからnginxへはHTTPで接続するため、$scheme は常に http になる)
# ヘッダーがない場合(ローカルでのコンテナ起動など)は、nginxが受けた通信の種類をそのまま使う
map $http_cloudfront_forwarded_proto $forwarded_proto {
    https   https;
    default $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API・Swagger UIはバックエンドのコンテナへ中継する(backend はComposeのサービス名)
    location ~ ^/(api/|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # ポート番号を含めて渡す(含めないとバックエンドが別オリジンと判定し、CORSで拒否される)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 画面(ビルド成果物)を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
}
