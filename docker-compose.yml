services:
  postgres:
    image: postgres:16-alpine
    container_name: communication-notebook-db
    environment:
      POSTGRES_DB: ${DB_NAME:-communication_notebook}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-communication_notebook}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
